<svg width="520" height="520" viewBox="0 0 520 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coinTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A6F66B"/>
      <stop offset="100%" stop-color="#89F336"/>
    </linearGradient>
    <linearGradient id="coinSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6CC22B"/>
      <stop offset="100%" stop-color="#4E8D1C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6CC22B"/>
      <stop offset="100%" stop-color="#3F7016"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#89F336" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#89F336" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="260" cy="260" r="235" fill="url(#glow)"/>

  <!-- small sparkles -->
  <path d="M90 90l6 14 14 6-14 6-6 14-6-14-14-6 14-6z" fill="#89F336"/>
  <path d="M420 80l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#89F336" fill-opacity="0.7"/>
  <path d="M440 330l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#89F336" fill-opacity="0.6"/>
  <path d="M70 350l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#89F336" fill-opacity="0.5"/>

  <!-- credit card behind -->
  <g transform="rotate(-8 260 300)">
    <rect x="120" y="190" width="280" height="180" rx="24" fill="url(#cardGrad)"/>
    <rect x="140" y="210" width="90" height="62" rx="10" fill="#89F336" fill-opacity="0.25"/>
    <rect x="150" y="222" width="70" height="38" rx="6" fill="url(#coinTop)"/>
    <rect x="150" y="222" width="70" height="38" rx="6" stroke="#ffffff" stroke-opacity="0.35"/>
    <path d="M150 300h220" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
    <path d="M150 322h140" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round"/>
    <path d="M150 344h180" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- back coin -->
  <g transform="translate(150 150)">
    <ellipse cx="0" cy="56" rx="92" ry="26" fill="url(#coinSide)"/>
    <circle cx="0" cy="0" r="88" fill="url(#coinTop)"/>
    <circle cx="0" cy="0" r="88" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="7" stroke-dasharray="4 8"/>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" fill="#ffffff">$</text>
  </g>

  <!-- front coin -->
  <g transform="translate(380 330)">
    <ellipse cx="0" cy="64" rx="104" ry="30" fill="url(#coinSide)"/>
    <circle cx="0" cy="0" r="100" fill="url(#coinTop)"/>
    <circle cx="0" cy="0" r="100" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="8" stroke-dasharray="5 9"/>
    <text x="0" y="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="900" fill="#ffffff">$</text>
  </g>
</svg>
